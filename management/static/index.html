<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Sasthotech Remote</title>
  <link rel="stylesheet" href="/console/assets/console.css">
  <script defer src="/console/assets/vendor/lucide.js"></script>
  <script defer src="/console/assets/console.js"></script>
</head>
<body>
  <header><div class="brand">Sasthotech <span>Remote</span></div><div id="identity"></div></header>
  <main>
    <section id="login-panel">
      <p class="eyebrow">Employee access</p><h1>Sign in</h1>
      <form id="login-form">
        <label>Username<input name="username" autocomplete="username" maxlength="100" required></label>
        <label>Password<input name="password" type="password" autocomplete="current-password" maxlength="256" required></label>
        <button type="submit" class="primary">Sign in</button>
      </form>
    </section>
    <section id="workspace" hidden>
      <div class="workspace-head"><nav aria-label="Sections" id="navigation"></nav><button id="logout">Sign out</button></div>
      <div class="section-head"><div><p class="eyebrow">Company workspace</p><h1 id="heading">Clients</h1></div><div id="commands"></div></div>
      <p id="scope-note" class="scope"></p>
      <form id="filters" class="filters"></form>
      <div id="content" aria-live="polite"></div>
      <div id="pagination" class="pagination"></div>
    </section>
    <p id="message" role="status" aria-live="polite"></p>
  </main>
  <dialog id="editor"><form id="editor-form"><div class="dialog-head"><h2 id="editor-title"></h2><button type="button" id="close-dialog" aria-label="Close dialog">Close</button></div><div id="editor-fields"></div><p id="editor-error" role="alert"></p><button type="submit" class="primary">Save</button></form></dialog>
</body>
</html>
